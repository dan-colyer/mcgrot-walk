<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>McGrot's — G1 four-up</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --ground:#1a1917; --panel:#232120; --ink:#e8e2d0; --soft:#a89f88;
    --rule:#3a352c; --accent:#b4623a; --mustard:#d3b05a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--ground); color:var(--ink);
               font:14px/1.5 system-ui,-apple-system,sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; }

  #bar { display:flex; align-items:center; gap:18px; flex-wrap:wrap;
         padding:10px 16px; border-bottom:1px solid var(--rule); background:var(--panel); }
  #bar h1 { font:600 12px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
            color:var(--accent); margin:0 8px 0 0; }
  .group { display:flex; gap:6px; align-items:center; }
  .group > label { font:600 10px/1 var(--mono); letter-spacing:.1em;
                   text-transform:uppercase; color:var(--soft); margin-right:2px; }
  button { font:500 13px/1 system-ui,sans-serif; color:var(--ink); background:transparent;
           border:1px solid var(--rule); padding:7px 12px; border-radius:3px; cursor:pointer; }
  button:hover { border-color:var(--soft); }
  button:focus-visible { outline:2px solid var(--mustard); outline-offset:2px; }
  button.on { background:var(--mustard); border-color:var(--mustard); color:#1a1917; font-weight:600; }
  input[type=range] { width:110px; accent-color:var(--mustard); }
  #rateOut { font:500 12px/1 var(--mono); color:var(--soft); min-width:38px;
             font-variant-numeric:tabular-nums; }
  #err { font:500 12px/1 var(--mono); color:var(--accent); }

  #labels { display:grid; border-bottom:1px solid var(--rule); background:var(--panel); }
  #labels span { font:600 11px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
                 color:var(--soft); padding:9px 12px; text-align:center;
                 border-left:1px solid var(--rule); }
  #labels span:first-child { border-left:0; }
  #labels span.failed { color:var(--accent); }

  #stage { flex:1; min-height:0; position:relative; }
  #scene { display:block; width:100%; height:100%; opacity:0; transition:opacity .35s ease; }
  body.ready #scene { opacity:1; }
  @media (prefers-reduced-motion: reduce) { #scene { transition:none; } }

  #hint { padding:8px 16px; border-top:1px solid var(--rule); background:var(--panel);
          font:400 12px/1.4 system-ui,sans-serif; color:var(--soft); }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <h1>G1 four-up</h1>
    <div class="group">
      <label for="play">Run</label>
      <button id="play" class="on">Pause</button>
      <button id="step">Step</button>
    </div>
    <div class="group">
      <label>Pose</label>
      <button data-mode="walk" class="on">Walk</button>
      <button data-mode="idle">Idle</button>
      <button data-mode="sit">Sit</button>
      <button data-mode="look">Head-turn</button>
    </div>
    <div class="group">
      <label for="rate">Speed</label>
      <input id="rate" type="range" min="0.1" max="2" step="0.05" value="1" />
      <span id="rateOut">1.00&times;</span>
    </div>
    <span id="err"></span>
  </div>
  <div id="labels"></div>
  <div id="stage"><canvas id="scene"></canvas></div>
  <div id="hint">Same scene, same light, same instant in the stride &mdash; only the body differs.
    Try <strong>Head-turn</strong>: A1 and A2 rotate a head, A3 can only lean.</div>
</div>
<script src="mcgrots-compare-bundle.js?v=dev"></script>
</body>
</html>
